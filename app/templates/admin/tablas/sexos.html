{% extends 'base.html' %}
{% block title %}Sexos{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
  <h4><i class="bi bi-gender-ambiguous me-2 text-primary"></i>Sexos</h4>
  <button class="btn btn-primary btn-sm" onclick="nuevo()"><i class="bi bi-plus-lg me-1"></i>Nuevo</button>
</div>
<div class="card">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead><tr><th>Código</th><th>Nombre</th><th></th></tr></thead>
      <tbody>
        {% for s in sexos %}
        <tr>
          <td><strong>{{ s.codigo }}</strong></td><td>{{ s.nombre }}</td>
          <td><button class="btn btn-sm btn-outline-primary"
            onclick='editar({{ s.id }}, "{{ s.codigo }}", "{{ s.nombre }}")'><i class="bi bi-pencil"></i></button></td>
        </tr>
        {% else %}<tr><td colspan="3" class="text-center text-muted py-4">Sin datos.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <form method="POST" action="{{ url_for('admin.sexo_guardar') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="id" id="fId">
      <div class="modal-header"><h5 class="modal-title">Sexo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Código</label>
          <input type="text" class="form-control" name="codigo" id="fCodigo" maxlength="2" required></div>
        <div class="mb-3"><label class="form-label">Nombre</label>
          <input type="text" class="form-control" name="nombre" id="fNombre" required></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div></div>
</div>
<script>
function nuevo(){document.getElementById('fId').value='';document.getElementById('fCodigo').value='';document.getElementById('fNombre').value='';new bootstrap.Modal(document.getElementById('modal')).show();}
function editar(id,codigo,nombre){document.getElementById('fId').value=id;document.getElementById('fCodigo').value=codigo;document.getElementById('fNombre').value=nombre;new bootstrap.Modal(document.getElementById('modal')).show();}
</script>
{% endblock %}
