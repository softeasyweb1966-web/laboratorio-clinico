{% extends 'base.html' %}
{% block title %}Resetear Contraseña — {{ usuario.username }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="page-header d-flex align-items-center gap-2">
      <i class="bi bi-key fs-4 text-warning"></i>
      <h4>Resetear Contraseña</h4>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <p class="text-muted mb-4">
          Asignando nueva contraseña para <strong>{{ usuario.nombre }}</strong>
          <span class="badge bg-secondary ms-1">{{ usuario.username }}</span>
        </p>
        <form method="POST" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Nueva Contraseña <span class="text-danger">*</span></label>
            <input type="password" class="form-control" name="password" required minlength="6" autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirmar Contraseña <span class="text-danger">*</span></label>
            <input type="password" class="form-control" name="confirma" required minlength="6">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">
              <i class="bi bi-check-lg me-1"></i>Guardar Nueva Contraseña
            </button>
            <a href="{{ url_for('admin.usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
