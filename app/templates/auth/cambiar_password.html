{% extends 'base.html' %}
{% block title %}Cambiar Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="page-header d-flex align-items-center gap-2">
      <i class="bi bi-key fs-4 text-primary"></i>
      <h4>Cambiar Contraseña</h4>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <form method="POST" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Contraseña Actual</label>
            <input type="password" class="form-control" name="password_actual" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nueva Contraseña</label>
            <input type="password" class="form-control" name="password_nueva" required minlength="6">
          </div>
          <div class="mb-4">
            <label class="form-label">Confirmar Nueva Contraseña</label>
            <input type="password" class="form-control" name="password_confirma" required minlength="6">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Guardar
            </button>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
