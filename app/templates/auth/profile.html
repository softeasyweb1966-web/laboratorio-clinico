{% extends "base.html" %}
{% block title %}Mi Perfil{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h4><i class="bi bi-person-circle me-2"></i>Mi Perfil</h4>
    <hr>
    <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Registro profesional</label>
        <input type="text" name="professional_id" class="form-control" value="{{ current_user.professional_id or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Firma profesional</label>
        <input type="file" name="signature_file" class="form-control" accept=".png,.jpg,.jpeg">
        {% if current_user.signature_image %}
        <small class="text-success">Firma cargada: {{ current_user.signature_image }}</small>
        {% else %}
        <small class="text-muted">Requerida para registrar resultados.</small>
        {% endif %}
      </div>
      <div class="mb-3">
        <label class="form-label">Nueva contraseña <small class="text-muted">(dejar en blanco para no cambiar)</small></label>
        <input type="password" name="new_password" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
    </form>
  </div>
</div>
{% endblock %}
