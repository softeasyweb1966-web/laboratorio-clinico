{% extends "base.html" %}
{% block title %}{{ 'Editar' if patient else 'Nuevo' }} Paciente{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h4><i class="bi bi-person-plus me-2"></i>{{ 'Editar' if patient else 'Nuevo' }} Paciente</h4>
    <hr>
    <form method="post" class="card p-4 shadow-sm">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Tipo de documento</label>
          <select name="document_type" class="form-select">
            {% for dt in ['CC','TI','CE','PP','NIT','RC'] %}
            <option value="{{ dt }}" {{ 'selected' if patient and patient.document_type==dt }}>{{ dt }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Número de documento *</label>
          <input type="text" name="document" class="form-control" required
                 value="{{ patient.document if patient else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Género</label>
          <select name="gender" class="form-select">
            <option value="">– No especificado –</option>
            <option value="M" {{ 'selected' if patient and patient.gender=='M' }}>Masculino</option>
            <option value="F" {{ 'selected' if patient and patient.gender=='F' }}>Femenino</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Nombre completo *</label>
          <input type="text" name="name" class="form-control" required
                 value="{{ patient.name if patient else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Fecha de nacimiento</label>
          <input type="date" name="birth_date" class="form-control"
                 value="{{ patient.birth_date.isoformat() if patient and patient.birth_date else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Teléfono</label>
          <input type="text" name="phone" class="form-control"
                 value="{{ patient.phone if patient else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Correo electrónico</label>
          <input type="email" name="email" class="form-control"
                 value="{{ patient.email if patient else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label">Dirección</label>
          <input type="text" name="address" class="form-control"
                 value="{{ patient.address if patient else '' }}">
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
          <a href="{{ url_for('orders.patients_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
